<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title x-text="business.name || 'Tienda'"></title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      #map {
        height: 350px;
        border-radius: 12px;
      }

      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>

  <body
    x-data="app()"
    x-init="init()"
    :class="[currentTheme.body, 'text-gray-800']"
  >
    <!-- LOADING SCREEN -->
    <div
      x-show="loading"
      x-transition.opacity
      class="fixed inset-0 z-[999] bg-white flex flex-col items-center justify-center"
    >
      <div
        class="w-14 h-14 border-4 border-gray-200 border-t-black rounded-full animate-spin mb-4"
      ></div>

      <p class="text-gray-600 text-sm tracking-wide">Cargando...</p>
    </div>
    <!-- HEADER -->
    <header class="relative">
      <select
        x-model="selectedTheme"
        @change="applyTheme"
        class="absolute top-4 right-4 border p-2 rounded bg-white"
      >
        <option value="black">Premium</option>
        <option value="blue">Tech</option>
        <option value="purple">General</option>
        <option value="red">Comida</option>
        <option value="green">Saludable</option>
      </select>
    </header>

    <!-- HERO -->
    <section class="py-16 text-center px-6">
      <h1 class="text-3xl md:text-4xl font-bold mb-4" x-text="hero.title"></h1>

      <p class="text-lg mb-6" x-text="hero.subtitle"></p>

      <a
        :href="whatsappUrl(hero.whatsappMessage)"
        target="_blank"
        class="inline-block text-white px-6 py-3 rounded transition"
        :class="buttonClass"
        x-text="hero.buttonText"
      >
      </a>
    </section>

    <!-- FILTROS -->
    <div class="flex flex-wrap gap-3 justify-center mb-8">
      <template x-for="category in categories" :key="category">
        <button
          @click="selectedCategory = category"
          class="px-4 py-2 rounded-full border transition"
          :class="
            selectedCategory === category
              ? buttonClass + ' text-white border-transparent'
              : 'bg-white hover:bg-gray-100'
          "
          x-text="category"
        ></button>
      </template>
    </div>

    <!-- PRODUCTOS -->
    <section
      x-show="sections.products"
      x-cloak
      class="py-12 px-6 max-w-5xl mx-auto"
    >
      <h2 class="text-2xl font-bold text-center mb-8">Productos Destacados</h2>

      <!-- SKELETON -->
      <div x-show="loadingProducts" class="grid md:grid-cols-3 gap-6">
        <template x-for="i in 3" :key="i">
          <div
            class="bg-white border border-gray-100 rounded p-4 shadow-sm animate-pulse"
          >
            <div class="w-full h-64 bg-gray-200 rounded mb-4"></div>

            <div class="h-6 bg-gray-200 rounded w-3/4 mx-auto mb-3"></div>

            <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-4 bg-gray-200 rounded w-5/6 mx-auto mb-4"></div>

            <div class="h-6 bg-gray-200 rounded w-1/3 mx-auto mb-4"></div>

            <div class="space-y-2">
              <div class="h-11 bg-gray-200 rounded"></div>
              <div class="h-11 bg-gray-200 rounded"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- PRODUCTOS -->
      <div
        x-show="!loadingProducts"
        x-transition.opacity
        class="grid md:grid-cols-3 gap-6"
      >
        <template x-for="product in filteredProducts" :key="product.name">
          <div
            x-data="{ currentImage: 0 }"
            class="bg-white border border-gray-100 rounded p-4 text-center shadow-sm transition hover:shadow-md"
          >
            <div class="relative overflow-hidden rounded mb-4">
              <img
                loading="lazy"
                :src="product.images[currentImage]"
                class="w-full h-80 object-cover transition-all duration-300"
              />

              <!-- BADGE -->
              <div
                x-show="product.badge"
                class="absolute top-3 left-3 bg-black text-white text-xs px-2 py-1 rounded-full"
                x-text="product.badge"
              ></div>
            </div>

            <!-- MINIATURAS -->
            <div class="flex justify-center gap-2 mb-4">
              <template x-for="(image, index) in product.images" :key="index">
                <button
                  @click="currentImage = index"
                  class="w-14 h-14 rounded overflow-hidden border-2 transition"
                  :class="
                    currentImage === index
                      ? 'border-black'
                      : 'border-transparent'
                  "
                >
                  <img :src="image" class="w-full h-full object-cover" />
                </button>
              </template>
            </div>

            <!-- COLORES -->
            <div class="flex justify-center gap-2 mb-4">
              <template x-for="color in product.colors" :key="color">
                <div
                  class="w-5 h-5 rounded-full border border-gray-300"
                  :style="`background:${color}`"
                ></div>
              </template>
            </div>

            <h3 class="font-semibold text-lg mb-2" x-text="product.name"></h3>

            <p class="mb-2" x-text="product.description"></p>

            <p class="font-bold mb-4" x-text="product.price"></p>

            <div class="flex flex-col gap-2">
              <a
                target="_blank"
                class="text-white px-6 py-3 rounded transition"
                :class="buttonClass"
                :href="whatsappUrl(product.whatsappMessage)"
                x-text="product.buttonText"
              >
              </a>

              <a
                target="_blank"
                class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded transition"
                :href="shareProduct(product)"
              >
                📲 Compartir
              </a>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- FAQ -->
    <section x-show="sections.faq" x-cloak class="py-12 px-6 max-w-5xl mx-auto">
      <h2 class="text-2xl font-bold text-center mb-8">Preguntas Frecuentes</h2>

      <div class="space-y-4">
        <template x-for="(item, index) in faq" :key="index">
          <div
            class="border border-gray-200 rounded p-4 cursor-pointer transition hover:bg-gray-50"
            @click="toggleFaq(index)"
          >
            <div class="flex justify-between items-center">
              <h4 class="font-semibold" x-text="item.question"></h4>

              <span x-text="openFaq === index ? '-' : '+'"></span>
            </div>

            <p
              x-show="openFaq === index"
              x-transition
              class="mt-2 text-gray-700"
              x-text="item.answer"
            ></p>
          </div>
        </template>
      </div>
    </section>

    <!-- MAPA -->
    <section x-show="sections.map" x-cloak class="py-12 px-6 max-w-5xl mx-auto">
      <h2 class="text-2xl font-bold text-center mb-6">Dónde Estamos</h2>

      <div id="map" class="mb-3"></div>

      <div class="text-center">
        <button
          @click="centerMap"
          class="text-white px-6 py-3 rounded transition"
          :class="buttonClass"
        >
          Centrar
        </button>
      </div>
    </section>

    <!-- INFO -->
    <section x-show="sections.info" x-cloak class="py-10 text-center px-6">
      <h3 class="text-xl font-semibold mb-2">Información</h3>

      <p x-text="business.address"></p>

      <p x-text="business.hours"></p>

      <a
        :href="'https://instagram.com/' + business.instagramHandle"
        target="_blank"
        class="text-blue-600 underline"
        x-text="'@' + business.instagramHandle"
      ></a>
    </section>

    <!-- BOTÓN WHATSAPP -->
    <a
      :href="whatsappUrl(hero.whatsappMessage)"
      target="_blank"
      class="fixed bottom-5 right-5 z-50 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-lg transition-all duration-300 transform hover:scale-110"
    >
      <img src="img/whatsapp.svg" alt="whatsapp" class="w-6 h-6" />
    </a>

    <!-- FOOTER -->
    <footer class="pb-8">
      <p class="text-sm text-gray-400 text-center mt-10">
        Sitio web desarrollado por
        <a href="https://martinponce.com.ar" target="_blank" class="underline">
          Martín Ponce
        </a>
      </p>

      <div class="text-center mt-2">
        <a
          href="https://wa.me/5491165035037?text=Hola!%20Vi%20tu%20página%20y%20me%20interesa%20tener%20una%20para%20mi%20negocio."
          target="_blank"
          class="text-sm text-blue-600 underline"
        >
          ¿Querés una página así para tu negocio? 👉 Hablame por WhatsApp
        </a>
      </div>
    </footer>

    <script>
      function app() {
        return {
          loading: true,
          loadingProducts: true,
          selectedCategory: 'Todos',

          // DATA
          business: {},
          hero: {},
          products: [],
          faq: [],
          mapData: {},
          sections: {},

          // FAQ
          openFaq: null,

          // MAP
          map: null,

          // THEME
          selectedTheme: 'black',

          themes: {
            black: {
              primary: 'bg-black',
              hover: 'hover:bg-gray-800',
              body: 'bg-gray-50',
            },

            blue: {
              primary: 'bg-blue-600',
              hover: 'hover:bg-blue-700',
              body: 'bg-blue-50',
            },

            purple: {
              primary: 'bg-purple-600',
              hover: 'hover:bg-purple-700',
              body: 'bg-purple-50',
            },

            red: {
              primary: 'bg-red-600',
              hover: 'hover:bg-red-700',
              body: 'bg-gray-50',
            },

            green: {
              primary: 'bg-green-600',
              hover: 'hover:bg-green-700',
              body: 'bg-green-50',
            },
          },

          get currentTheme() {
            return this.themes[this.selectedTheme];
          },

          get buttonClass() {
            return `${this.currentTheme.primary} ${this.currentTheme.hover}`;
          },

          get categories() {
            const categories = this.products.map((p) => p.category);

            return ['Todos', ...new Set(categories)];
          },

          get filteredProducts() {
            if (this.selectedCategory === 'Todos') {
              return this.products;
            }

            return this.products.filter(
              (p) => p.category === this.selectedCategory,
            );
          },

          // INIT
          async init() {
            const response = await fetch('data.json');
            const data = await response.json();

            this.business = data.business;
            this.hero = data.hero;
            this.products = data.products || [];
            this.faq = data.faq || [];
            this.mapData = data.map || {};
            this.sections = data.sections || {};

            setTimeout(() => {
              this.loading = false;
            }, 300);

            setTimeout(() => {
              this.loadingProducts = false;
            }, 700);

            document.title = this.business.name;

            this.$nextTick(() => {
              if (this.sections.map) {
                this.initMap();
              }
            });
          },

          // HELPERS
          whatsappUrl(message) {
            return `https://wa.me/${this.business.whatsapp}?text=${encodeURIComponent(message)}`;
          },

          shareProduct(product) {
            const pageUrl = window.location.href;

            return `https://wa.me/?text=${encodeURIComponent(
              'Mirá este producto: ' + product.name + ' - ' + pageUrl,
            )}`;
          },

          // FAQ
          toggleFaq(index) {
            this.openFaq = this.openFaq === index ? null : index;
          },

          // MAP
          initMap() {
            this.map = L.map('map').setView(
              [this.mapData.latitude, this.mapData.longitude],
              this.mapData.zoom,
            );

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors',
            }).addTo(this.map);

            L.marker([this.mapData.latitude, this.mapData.longitude])
              .addTo(this.map)
              .bindPopup(this.business.name)
              .openPopup();
          },

          centerMap() {
            this.map.setView(
              [this.mapData.latitude, this.mapData.longitude],
              this.mapData.zoom,
            );
          },

          // THEME
          applyTheme() {
            // Alpine ya recalcula automáticamente
          },
        };
      }
    </script>
  </body>
</html>
